name: Preview and replace (posts nothing unless data/replace.json says replace)

on:
  workflow_dispatch:
  push:
    paths: ["data/preview.json", "data/replace.json"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q pillow numpy edge-tts
      - name: Run what changed
        env:
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD)
          echo "$changed"
          if echo "$changed" | grep -q "data/replace.json"; then python engine/replace_post.py; fi
          if echo "$changed" | grep -q "data/preview.json"; then python engine/preview.py; fi
      - name: Save results
        if: always()
        run: |
          git config user.name "sti-bot"
          git config user.email "sti-bot@users.noreply.github.com"
          git add -f previews data/log.csv || true
          git diff --cached --quiet || git commit -m "Preview/replace result"
          git pull --rebase -q && git push
