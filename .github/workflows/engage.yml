name: Instagram replies

on:
  workflow_dispatch:
    inputs:
      approve:
        description: "Post drafted replies: all, or numbers like 1,3,4 (others are skipped)"
        default: "all"
      action:
        description: "post (default), draft (check for new comments now) or setup-dm (refresh the SCRIPTS auto-DM)"
        default: "post"

permissions:
  contents: write

concurrency: sti-daily

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          ACTION: ${{ github.event.inputs.action }}
          APPROVE: ${{ github.event.inputs.approve }}
        run: python engine/ig_engage.py "$ACTION" --approve "$APPROVE"
      - name: Save
        run: |
          git config user.name "sti-bot"
          git config user.email "sti-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Instagram replies $(date -u +%F)"
          git pull --rebase -q && git push
